name: Validate SABLE CIRCUIT

on:
  workflow_dispatch:
    inputs:
      run_heavy:
        description: "Run Godot headless checks and runtime capture (uses Actions minutes)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: sable-circuit-validate-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GODOT_ARCHIVE: "Godot_v4.7.2-stable_linux.x86_64.zip"
  GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate repository contract
        run: python tools/validate_project.py
      - name: Validate unique art identities
        run: python tools/validate_unique_art.py
      - name: Validate M5 production presentation
        run: python tools/validate_m5_presentation.py

  godot-headless:
    if: ${{ inputs.run_heavy }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Fetch pinned external assets
        run: python tools/fetch_external_assets.py
      - name: Download pinned Godot editor
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${GODOT_ARCHIVE}"
          curl -fL --retry 3 --retry-delay 2 "$url" -o "$RUNNER_TEMP/godot.zip"
          echo "${GODOT_SHA256}  $RUNNER_TEMP/godot.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
      - name: Verify Godot version
        run: "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --version"
      - name: Headless editor import and parse
        run: "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --editor --path $GITHUB_WORKSPACE --quit"
      - name: Headless bootstrap smoke run
        run: "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path $GITHUB_WORKSPACE --quit-after 2"
      - name: Playable squad prototype smoke test
        run: "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path $GITHUB_WORKSPACE --script res://tests/smoke/prototype_smoke.gd"
      - name: M2 lobby and story flow smoke test
        run: "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path $GITHUB_WORKSPACE --script res://tests/smoke/m2_story_flow_smoke.gd"
      - name: M3 unique art runtime smoke test
        run: "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path $GITHUB_WORKSPACE --script res://tests/smoke/m3_unique_art_smoke.gd"
      - name: M4 premium motion and environment smoke test
        run: "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path $GITHUB_WORKSPACE --script res://tests/smoke/m4_premium_motion_environment_smoke.gd"
      - name: M5 bundled HUD font smoke test
        run: "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path $GITHUB_WORKSPACE --script res://tests/smoke/m5_font_smoke.gd"

  runtime-capture:
    if: ${{ inputs.run_heavy }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Fetch pinned external assets
        run: python tools/fetch_external_assets.py
      - name: Download pinned Godot editor
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${GODOT_ARCHIVE}"
          curl -fL --retry 3 --retry-delay 2 "$url" -o "$RUNNER_TEMP/godot.zip"
          echo "${GODOT_SHA256}  $RUNNER_TEMP/godot.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
      - name: Import assets for rendered capture
        run: "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --editor --path $GITHUB_WORKSPACE --quit"
      - name: Render actual runtime captures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/runtime_capture
          xvfb-run -a -s "-screen 0 1280x720x24" "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" --path "$GITHUB_WORKSPACE" --resolution 1280x720 --rendering-method gl_compatibility --script res://tests/render/runtime_capture.gd
          test -f artifacts/runtime_capture/01_map_movement.png
          test -f artifacts/runtime_capture/02_combat_decon.png
          test -f artifacts/runtime_capture/03_boss_phase3.png
          test -f artifacts/runtime_capture/12_direction_sector_0.png
          test -f artifacts/runtime_capture/19_direction_sector_7.png
          test -f artifacts/runtime_capture/20_death_rifle.png
          test -f artifacts/runtime_capture/24_death_boss.png
          count=$(find artifacts/runtime_capture -name '*.png' | wc -l)
          test "$count" -eq 24
      - name: Upload real runtime screenshots
        uses: actions/upload-artifact@v4
        with:
          name: sable-circuit-runtime-captures
          path: artifacts/runtime_capture/*.png
          if-no-files-found: error
          retention-days: 14
