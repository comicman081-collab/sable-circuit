name: Fetch Pinned Rajdhani M5

on:
  push:
    branches: ["feat/m5-runtime-capture-production-visuals"]

permissions:
  contents: read

jobs:
  fetch-font-source:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact Google Fonts Rajdhani revision
        shell: bash
        run: |
          set -euo pipefail
          REV="9d1ce2fc3c335cca32b6db00c19f55d57b0a68fe"
          BASE="https://raw.githubusercontent.com/google/fonts/${REV}/ofl/rajdhani"
          mkdir -p rajdhani-source
          curl -fL --retry 3 --retry-delay 2 "${BASE}/Rajdhani-Medium.ttf" -o rajdhani-source/Rajdhani-Medium.ttf
          curl -fL --retry 3 --retry-delay 2 "${BASE}/OFL.txt" -o rajdhani-source/OFL.txt
          sha256sum rajdhani-source/Rajdhani-Medium.ttf rajdhani-source/OFL.txt | tee rajdhani-source/SHA256SUMS.txt
          printf '%s\n' "Source: google/fonts" "Revision: ${REV}" "License: OFL-1.1" > rajdhani-source/SOURCE.txt
      - name: Upload pinned source
        uses: actions/upload-artifact@v4
        with:
          name: rajdhani-m5-pinned-source
          path: rajdhani-source/*
          if-no-files-found: error
          retention-days: 2
