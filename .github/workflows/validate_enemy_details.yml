name: Validate M6 Enemy Details

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sable-circuit-enemy-detail-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.2'
  GODOT_ARCHIVE: 'Godot_v4.7.2-stable_linux.x86_64.zip'
  GODOT_SHA256: 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4'

jobs:
  enemy-detail-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Fetch pinned external assets
        run: python tools/fetch_external_assets.py

      - name: Download pinned Godot editor
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${GODOT_ARCHIVE}"
          curl -fL --retry 3 --retry-delay 2 "$url" -o "$RUNNER_TEMP/godot.zip"
          echo "${GODOT_SHA256}  $RUNNER_TEMP/godot.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"

      - name: Import current project and SVG assets
        run: $RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --editor --path $GITHUB_WORKSPACE --quit

      - name: Validate five unique enemy detail overlays
        run: $RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path $GITHUB_WORKSPACE --script res://tests/smoke/m6_enemy_detail_smoke.gd
